name: Portfolio CI

on:
  push:
    branches:
      - main
      - develop
      - feature/github-actions

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          test -f index.html
          test -f about.html
          test -f contact.html

      - name: Check CSS file exists
        run: |
          test -f style.css

      - name: CI Passed
        run: echo "Portfolio CI passed successfully!"
